name: EstateFlow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    name: Database, identity, publication and search acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: |
          python -m pip install -r project/requirements.txt -r project/services/property/tests/requirements.txt -r project/services/engagement/tests/requirements.txt
          python -m pip check

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: project/frontend/package-lock.json

      - name: Install frontend dependencies and Chromium
        working-directory: project/frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run frontend, PostgreSQL 17 roles, identity, drafts, publication and search acceptance
        run: python project/tests/integration/identity_acceptance.py
