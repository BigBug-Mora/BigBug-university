&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;

  const stringify = JSON.stringify;

  );

      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      modelContent: null,
      privateContent: null,

  const mockElement = document.getElementById(&quot;codex-connector-mocks&quot;);
  const fileElement = document.getElementById(&quot;codex-preview-files&quot;);
  const connectorGlobals = {};

    if (fileElement != null) {

      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;

      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,

      new CustomEvent(&quot;openai:set_globals&quot;, {

        ),

    &quot;message&quot;,
    (event) =&gt; {

      const source = apply(getMessageSource, event, []);

        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||

      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

              /** @type {unknown} */

              if (typeof id !== &quot;number&quot;) {

              }

      }

    }

      element = event.target;
    } else if (event.target instanceof globalThis.Node) {

#estateflow-courtyard *, #estateflow-courtyard *::before, #estateflow-courtyard *::after { box-sizing: border-box; }
#estateflow-courtyard h1, #estateflow-courtyard h2, #estateflow-courtyard h3, #estateflow-courtyard p, #estateflow-courtyard dl, #estateflow-courtyard dd, #estateflow-courtyard figure { margin: 0; }
#estateflow-courtyard h1, #estateflow-courtyard h2, #estateflow-courtyard h3, #estateflow-courtyard .ef-brand { font-family: &quot;Instrument Serif&quot;, Georgia, serif; font-weight: 400; line-height: 1.02; }
#estateflow-courtyard h1 { font-size: clamp(48px, 9cqi, 108px); letter-spacing: -.025em; }
#estateflow-courtyard h2 { font-size: clamp(35px, 5.8cqi, 60px); letter-spacing: -.015em; }
#estateflow-courtyard h3 { font-size: clamp(27px, 4cqi, 42px); }
#estateflow-courtyard a { color: inherit; text-underline-offset: .3em; }
#estateflow-courtyard .ef-shell { padding-inline: clamp(18px, 5cqi, 62px); }
#estateflow-courtyard .ef-nav { min-height: 72px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; border-bottom: 1px solid var(--line); padding-block: 10px; }
#estateflow-courtyard .ef-brand { font-size: 33px; }
#estateflow-courtyard .ef-nav-links, #estateflow-courtyard .ef-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
#estateflow-courtyard .ef-nav a { display: inline-flex; align-items: center; min-height: 44px; }
#estateflow-courtyard .ef-intro { padding-block: clamp(28px, 6cqi, 66px) 28px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 15px 30px; align-items: end; }
#estateflow-courtyard .ef-kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
#estateflow-courtyard .ef-price { font: 400 clamp(29px, 4.3cqi, 47px)/1.08 &quot;Instrument Serif&quot;, Georgia, serif; text-align: right; }
#estateflow-courtyard .ef-price small { display: block; font: 400 13px/1.8 &quot;DM Sans&quot;, sans-serif; color: var(--muted); }
#estateflow-courtyard .ef-image { aspect-ratio: 3 / 2; background-color: var(--image); background-image: var(--property-photos); background-repeat: no-repeat; background-size: 200% 200%; }
#estateflow-courtyard .ef-exterior { background-position: left top; }
#estateflow-courtyard .ef-living { background-position: right top; }
#estateflow-courtyard .ef-bedroom { background-position: left bottom; }
#estateflow-courtyard .ef-garden { background-position: right bottom; }
#estateflow-courtyard .ef-hero { overflow: hidden; }
#estateflow-courtyard .ef-hero .ef-image { width: 100%; margin-block: -8%; }
#estateflow-courtyard .ef-overview { display: grid; grid-template-columns: 1.1fr 1fr; gap: 26px clamp(30px, 7cqi, 76px); padding-block: clamp(34px, 7cqi, 76px); border-bottom: 1px solid var(--line); }
#estateflow-courtyard .ef-overview p:not(.ef-kicker), #estateflow-courtyard .ef-story p { color: var(--muted); max-width: 40ch; margin-top: 12px; }
#estateflow-courtyard .ef-facts { min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; align-content: center; }
#estateflow-courtyard .ef-facts &gt; div { min-width: 0; border-top: 1px solid var(--line); padding-top: 8px; }
#estateflow-courtyard .ef-facts dt { font-size: 13px; color: var(--muted); }
#estateflow-courtyard .ef-facts dd { font: 400 clamp(26px, 4.8cqi, 42px)/1.15 &quot;Instrument Serif&quot;, Georgia, serif; }
#estateflow-courtyard .ef-stories { display: grid; gap: clamp(30px, 6cqi, 62px); padding-block: clamp(32px, 6cqi, 66px); }
#estateflow-courtyard .ef-story { display: grid; grid-template-columns: 1.35fr 1fr; gap: clamp(15px, 4cqi, 45px); align-items: center; }
#estateflow-courtyard .ef-story:nth-child(2) { grid-template-columns: 1fr 1.35fr; }
#estateflow-courtyard .ef-story:nth-child(2) figure { order: 1; }
#estateflow-courtyard .ef-details { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 38px; padding-block: 27px 38px; border-top: 1px solid var(--line); }
#estateflow-courtyard .ef-details h2 { grid-column: 1 / -1; }
#estateflow-courtyard .ef-details dl &gt; div { display: flex; justify-content: space-between; gap: 8px 12px; padding-block: 9px; border-bottom: 1px solid var(--line); }
#estateflow-courtyard .ef-details dt { color: var(--muted); }
#estateflow-courtyard .ef-details dd { text-align: right; }
#estateflow-courtyard .ef-contact { border-block: 1px solid var(--line); padding-block: 27px; }
#estateflow-courtyard .ef-contact p { margin-top: 6px; color: var(--muted); }
#estateflow-courtyard .ef-actions { margin-top: 12px; }
#estateflow-courtyard button { font: 500 14px/1.3 &quot;DM Sans&quot;, sans-serif; padding: 10px 14px; min-height: 44px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 3px; }
#estateflow-courtyard .ef-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
#estateflow-courtyard .ef-contact [role=&quot;status&quot;]:empty { display: none; }
#estateflow-courtyard .ef-gallery { padding-block: 34px 48px; }

#estateflow-courtyard .ef-gallery-preview { margin-top: 10px; }

#estateflow-courtyard .ef-gallery-preview button { justify-self: start; padding: 8px 12px; }
#estateflow-courtyard .ef-foot { padding-block: 18px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
