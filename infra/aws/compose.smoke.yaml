services:
  rds-check:
    image: postgres:17-bookworm
    network_mode: host
    entrypoint: ["psql", "-X", "-W", "-v", "ON_ERROR_STOP=1"]
    environment:
      PGCONNECT_TIMEOUT: "10"
    volumes:
      - type: bind
        source: ${ESTATEFLOW_RDS_CA_FILE:?Set the absolute path to the AWS RDS CA bundle}
        target: /rds-ca.pem
        read_only: true
        bind:
          create_host_path: false
