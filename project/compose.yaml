services:
  property-service:
    build:
      context: .
      dockerfile: services/property/Dockerfile
    environment:
      ESTATEFLOW_COGNITO_ISSUER: ${ESTATEFLOW_COGNITO_ISSUER:-}
      ESTATEFLOW_COGNITO_CLIENT_ID: ${ESTATEFLOW_COGNITO_CLIENT_ID:-}
      ESTATEFLOW_TEST_ALLOW_HTTP_ISSUER: ${ESTATEFLOW_TEST_ALLOW_HTTP_ISSUER:-0}
      ESTATEFLOW_ENGAGEMENT_BASE_URL: ${ESTATEFLOW_ENGAGEMENT_BASE_URL:-}
      ESTATEFLOW_FRONTEND_TO_PROPERTY_TOKEN: ${ESTATEFLOW_FRONTEND_TO_PROPERTY_TOKEN:-}
      ESTATEFLOW_PROPERTY_TO_ENGAGEMENT_TOKEN: ${ESTATEFLOW_PROPERTY_TO_ENGAGEMENT_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 3
  engagement-service:
    profiles: [identity]
    build:
      context: .
      dockerfile: services/engagement/Dockerfile
    environment:
      ESTATEFLOW_ENGAGEMENT_DATABASE_URL: ${ESTATEFLOW_ENGAGEMENT_DATABASE_URL:-}
      ESTATEFLOW_COGNITO_ISSUER: ${ESTATEFLOW_COGNITO_ISSUER:-}
      ESTATEFLOW_COGNITO_CLIENT_ID: ${ESTATEFLOW_COGNITO_CLIENT_ID:-}
      ESTATEFLOW_TEST_ALLOW_HTTP_ISSUER: ${ESTATEFLOW_TEST_ALLOW_HTTP_ISSUER:-0}
      ESTATEFLOW_FRONTEND_TO_ENGAGEMENT_TOKEN: ${ESTATEFLOW_FRONTEND_TO_ENGAGEMENT_TOKEN:-}
      ESTATEFLOW_PROPERTY_TO_ENGAGEMENT_TOKEN: ${ESTATEFLOW_PROPERTY_TO_ENGAGEMENT_TOKEN:-}
  frontend:
    profiles: [identity]
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      property-service:
        condition: service_healthy
      engagement-service:
        condition: service_started
    environment:
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-}
      ESTATEFLOW_COGNITO_ISSUER: ${ESTATEFLOW_COGNITO_ISSUER:-}
      ESTATEFLOW_COGNITO_CLIENT_ID: ${ESTATEFLOW_COGNITO_CLIENT_ID:-}
      ESTATEFLOW_COGNITO_CLIENT_SECRET: ${ESTATEFLOW_COGNITO_CLIENT_SECRET:-}
      ESTATEFLOW_COGNITO_LOGIN_ORIGIN: ${ESTATEFLOW_COGNITO_LOGIN_ORIGIN:-}
      ESTATEFLOW_TEST_ALLOW_HTTP_ISSUER: ${ESTATEFLOW_TEST_ALLOW_HTTP_ISSUER:-0}
      ESTATEFLOW_ENGAGEMENT_BASE_URL: http://engagement-service:8000
      ESTATEFLOW_PROPERTY_BASE_URL: http://property-service:8000
      ESTATEFLOW_FRONTEND_TO_ENGAGEMENT_TOKEN: ${ESTATEFLOW_FRONTEND_TO_ENGAGEMENT_TOKEN:-}
      ESTATEFLOW_FRONTEND_TO_PROPERTY_TOKEN: ${ESTATEFLOW_FRONTEND_TO_PROPERTY_TOKEN:-}
